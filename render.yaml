services:
  - type: web
    name: shikshasign-live
    runtime: python
    plan: free
    buildCommand: >-
      python -m pip install --upgrade pip &&
      python -m pip install -r requirements.txt &&
      python -m backend.scripts.prepare_asl --download &&
      npm ci &&
      npm run build
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SIGN_ALLOWED_ORIGINS
        sync: false
